version: '3.9'

services:
  # Database service
  db:
    image: postgres:15-alpine
    container_name: job_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_DB: jobsdb
      POSTGRES_PASSWORD: jobuser_password
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-migrations
      - ./init-db:/docker-entrypoint-initdb.d
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"

  # PgAdmin (database administration tool)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: job_pgadmin
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - scraper-network
    ports:
      - "5050:80"

  # Redis service required for Superset
  redis:
    image: redis:7-alpine
    container_name: job_redis
    restart: unless-stopped
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Superset (analytics dashboard)
  superset:
    build:
      context: ./superset
    container_name: job_superset
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      bash -c "superset db upgrade && 
      echo 'admin_password' | superset fab create-admin --username admin --firstname Admin --lastname User --email admin@example.com --password-stdin && 
      superset init && 
      superset run --host=0.0.0.0 -p 8088 --with-threads --reload --debugger"
    environment:
      SUPERSET_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jobuser
      DB_NAME: jobsdb
      DB_PASSWORD: jobuser_password
      REDIS_HOST: redis
      SUPERSET_SECRET_KEY: superset_secret_key_value
    volumes:
      - superset_home:/app/superset_home
    networks:
      - scraper-network
    ports:
      - "8088:8088"

  # Job scraper application
  scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: job_scraper
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SCRAPER_ENV: production
      TZ: Asia/Tehran
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: jobuser
      DB_NAME: jobsdb
      DB_PASSWORD: jobuser_password
      ENABLE_CRON: "true"
    volumes:
      - ./job_data:/app/data
      - ./config:/app/config
      - ./migrations:/app/migrations
      - ./logs:/app/logs
    networks:
      - scraper-network
    ports:
      - "8082:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Test Server (simplified version for testing the API)
  test:
    image: python:3.10-slim
    container_name: job_test
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y curl && pip install fastapi uvicorn && python3 test_server.py"
    networks:
      - scraper-network
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Admin Dashboard
  admin:
    image: python:3.10-slim
    container_name: job_admin
    restart: unless-stopped
    volumes:
      - .:/app
    working_dir: /app
    command: bash -c "apt-get update && apt-get install -y curl && pip install -r requirements.txt fastapi uvicorn && python3 run_admin.py"
    networks:
      - scraper-network
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
    name: job_postgres_data
  pgadmin_data:
    name: job_pgadmin_data
  superset_home:
    name: job_superset_home

networks:
  scraper-network:
    name: job_scraper_network 