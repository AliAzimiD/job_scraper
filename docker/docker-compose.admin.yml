version: '3.9'

services:
  # Admin Dashboard service
  admin:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: job_admin
    restart: unless-stopped
    environment:
      - ADMIN_MODE=true
      - TZ=Asia/Tehran
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=jobuser
      - DB_NAME=jobsdb
      - DB_PASSWORD_FILE=/run/secrets/db_password
    volumes:
      - ../src:/app/src
      - ../public:/app/public
      - ../logs:/app/logs
      - ../config:/app/config
    ports:
      - "8081:8081"
    command: python -m src.main
    secrets:
      - db_password
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  # Database service
  db:
    image: postgres:15-alpine
    container_name: job_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: jobuser
      POSTGRES_DB: jobsdb
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-migrations
      - ../init-db:/docker-entrypoint-initdb.d
    networks:
      - scraper-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobuser -d jobsdb"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "5432:5432"
    secrets:
      - db_password

volumes:
  postgres_data:
    name: job_postgres_data

networks:
  scraper-network:
    name: job_scraper_network

secrets:
  db_password:
    file: ../secrets/db_password.txt 