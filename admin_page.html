<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraper Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card {
            margin-bottom: 20px;
        }
        .logs {
            max-height: 300px;
            overflow-y: auto;
            font-family: monospace;
            background-color: #f8f9fa;
            padding: 10px;
            border-radius: 5px;
        }
        .log-entry {
            margin: 0;
            padding: 2px 0;
            border-bottom: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">Job Scraper Admin</a>
            <button type="button" class="btn btn-success ms-auto" id="refreshAll">Refresh All</button>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <!-- Status Panel -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Current Status</div>
                    <div class="card-body">
                        <div id="statusPanel">
                            <p><strong>Current Status:</strong> <span id="currentStatus">Loading...</span></p>
                            <p><strong>Total Jobs:</strong> <span id="totalJobs">0</span></p>
                            <p><strong>Last Scrape:</strong> <span id="lastScrape">Never</span></p>
                            <div class="d-grid gap-2 d-md-flex justify-content-md-start">
                                <button type="button" class="btn btn-primary" id="startScrape">Start Scrape</button>
                                <button type="button" class="btn btn-danger" id="stopScrape" disabled>Stop Scrape</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Recent Jobs Panel -->
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">Recent Jobs</div>
                    <div class="card-body">
                        <div id="recentJobsPanel">
                            <p>Loading recent jobs...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Configuration Panel -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">Configuration</div>
                    <div class="card-body">
                        <div id="configPanel">
                            <p>Loading configuration...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Logs Panel -->
        <div class="row">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <div class="d-flex justify-content-between align-items-center">
                            <span>Logs</span>
                            <div class="input-group" style="width: 200px;">
                                <span class="input-group-text">Limit</span>
                                <input type="number" class="form-control" id="logLimit" value="20" min="5" max="100">
                                <button class="btn btn-outline-secondary" type="button" id="refreshLogs">Refresh</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="logsPanel" class="logs">
                            <p>Loading logs...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="bg-light py-3 mt-4">
        <div class="container text-center">
            <p class="mb-0">Job Scraper Admin Dashboard</p>
        </div>
    </footer>

    <script>
        // API endpoints
        const API_BASE_URL = '';
        const API_STATS = `${API_BASE_URL}/api/stats`;
        const API_LOGS = `${API_BASE_URL}/api/logs`;
        const API_CONFIG = `${API_BASE_URL}/api/config`;
        const API_START_SCRAPE = `${API_BASE_URL}/api/scrape/start`;
        const API_STOP_SCRAPE = `${API_BASE_URL}/api/scrape/stop`;

        // DOM elements
        const currentStatus = document.getElementById('currentStatus');
        const totalJobs = document.getElementById('totalJobs');
        const lastScrape = document.getElementById('lastScrape');
        const startScrapeBtn = document.getElementById('startScrape');
        const stopScrapeBtn = document.getElementById('stopScrape');
        const recentJobsPanel = document.getElementById('recentJobsPanel');
        const configPanel = document.getElementById('configPanel');
        const logsPanel = document.getElementById('logsPanel');
        const logLimit = document.getElementById('logLimit');
        const refreshLogsBtn = document.getElementById('refreshLogs');
        const refreshAllBtn = document.getElementById('refreshAll');

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            refreshAll();

            startScrapeBtn.addEventListener('click', async function() {
                try {
                    const response = await fetch(API_START_SCRAPE, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    alert(data.message || 'Scrape started');
                    refreshStatus();
                } catch (error) {
                    console.error('Error starting scrape:', error);
                    alert('Error starting scrape');
                }
            });

            stopScrapeBtn.addEventListener('click', async function() {
                try {
                    const response = await fetch(API_STOP_SCRAPE, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    alert(data.message || 'Scrape stopped');
                    refreshStatus();
                } catch (error) {
                    console.error('Error stopping scrape:', error);
                    alert('Error stopping scrape');
                }
            });

            refreshLogsBtn.addEventListener('click', function() {
                refreshLogs();
            });

            refreshAllBtn.addEventListener('click', function() {
                refreshAll();
            });
        });

        // Functions
        async function refreshStatus() {
            try {
                const response = await fetch(API_STATS);
                const data = await response.json();
                
                // Update status information
                currentStatus.textContent = data.is_running ? 'Running' : 'Idle';
                totalJobs.textContent = data.total_jobs || 0;
                lastScrape.textContent = data.last_scrape_time ? new Date(data.last_scrape_time).toLocaleString() : 'Never';
                
                // Update button states
                startScrapeBtn.disabled = data.is_running;
                stopScrapeBtn.disabled = !data.is_running;
                
                // Update recent jobs
                if (data.recent_jobs && data.recent_jobs.length > 0) {
                    updateRecentJobs(data.recent_jobs);
                } else {
                    recentJobsPanel.innerHTML = '<p>No recent jobs found</p>';
                }
            } catch (error) {
                console.error('Error refreshing status:', error);
                currentStatus.textContent = 'Error';
            }
        }

        function updateRecentJobs(jobs) {
            let html = '<div class="table-responsive"><table class="table table-sm">';
            html += '<thead><tr><th>Title</th><th>Company</th><th>Location</th><th>Date</th></tr></thead>';
            html += '<tbody>';
            
            jobs.forEach(job => {
                html += `<tr>
                    <td>${job.title || 'N/A'}</td>
                    <td>${job.company || 'N/A'}</td>
                    <td>${job.location || 'N/A'}</td>
                    <td>${job.date || 'N/A'}</td>
                </tr>`;
            });
            
            html += '</tbody></table></div>';
            recentJobsPanel.innerHTML = html;
        }

        async function refreshLogs() {
            try {
                const limit = parseInt(logLimit.value) || 20;
                const response = await fetch(`${API_LOGS}?limit=${limit}`);
                const data = await response.json();
                
                if (data.logs && data.logs.length > 0) {
                    let html = '';
                    data.logs.forEach(log => {
                        html += `<p class="log-entry">${log}</p>`;
                    });
                    logsPanel.innerHTML = html;
                    // Scroll to bottom
                    logsPanel.scrollTop = logsPanel.scrollHeight;
                } else {
                    logsPanel.innerHTML = '<p>No logs found</p>';
                }
            } catch (error) {
                console.error('Error refreshing logs:', error);
                logsPanel.innerHTML = '<p>Error loading logs</p>';
            }
        }

        async function refreshConfig() {
            try {
                const response = await fetch(API_CONFIG);
                const config = await response.json();
                
                if (config) {
                    let html = '<form class="config-form">';
                    
                    // Global settings
                    html += '<div class="mb-3"><h5>Global Settings</h5>';
                    html += `<div class="form-check mb-2">
                        <input class="form-check-input" type="checkbox" id="configEnabled" ${config.enabled ? 'checked' : ''}>
                        <label class="form-check-label" for="configEnabled">Scraper Enabled</label>
                    </div>`;
                    
                    html += `<div class="mb-2">
                        <label for="configSchedule" class="form-label">Schedule (cron format)</label>
                        <input type="text" class="form-control" id="configSchedule" value="${config.schedule || ''}">
                    </div>`;
                    
                    html += `<div class="mb-2">
                        <label for="configInterval" class="form-label">Scrape Interval (hours)</label>
                        <input type="number" class="form-control" id="configInterval" value="${config.scrape_interval_hours || 24}">
                    </div>`;
                    
                    html += `<div class="mb-2">
                        <label for="configMaxPages" class="form-label">Max Pages Per Source</label>
                        <input type="number" class="form-control" id="configMaxPages" value="${config.max_pages_per_source || 5}">
                    </div>`;
                    
                    html += `<div class="mb-2">
                        <label for="configTimeout" class="form-label">Timeout (seconds)</label>
                        <input type="number" class="form-control" id="configTimeout" value="${config.timeout_seconds || 30}">
                    </div>`;
                    
                    html += `<div class="mb-2">
                        <label for="configUserAgent" class="form-label">User Agent</label>
                        <input type="text" class="form-control" id="configUserAgent" value="${config.user_agent || ''}">
                    </div>`;
                    html += '</div>';
                    
                    // Sources
                    html += '<div class="mb-3"><h5>Sources</h5><div id="sourcesList">';
                    
                    if (config.sources && config.sources.length > 0) {
                        config.sources.forEach((source, index) => {
                            html += `<div class="card mb-2">
                                <div class="card-body">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" id="sourceEnabled${index}" ${source.enabled ? 'checked' : ''}>
                                        <label class="form-check-label" for="sourceEnabled${index}">Enabled</label>
                                    </div>
                                    <div class="mb-2">
                                        <label for="sourceName${index}" class="form-label">Name</label>
                                        <input type="text" class="form-control" id="sourceName${index}" value="${source.name || ''}">
                                    </div>
                                    <div class="mb-2">
                                        <label for="sourceUrl${index}" class="form-label">URL</label>
                                        <input type="text" class="form-control" id="sourceUrl${index}" value="${source.url || ''}">
                                    </div>
                                </div>
                            </div>`;
                        });
                    } else {
                        html += '<p>No sources configured</p>';
                    }
                    
                    html += '</div></div>';
                    
                    // Save button
                    html += '<button type="button" class="btn btn-primary" id="saveConfig">Save Configuration</button>';
                    
                    html += '</form>';
                    configPanel.innerHTML = html;
                    
                    // Add event listener for save button
                    document.getElementById('saveConfig').addEventListener('click', function() {
                        const updatedConfig = {
                            enabled: document.getElementById('configEnabled').checked,
                            schedule: document.getElementById('configSchedule').value,
                            scrape_interval_hours: parseInt(document.getElementById('configInterval').value) || 24,
                            max_pages_per_source: parseInt(document.getElementById('configMaxPages').value) || 5,
                            timeout_seconds: parseInt(document.getElementById('configTimeout').value) || 30,
                            user_agent: document.getElementById('configUserAgent').value,
                            sources: []
                        };
                        
                        if (config.sources && config.sources.length > 0) {
                            config.sources.forEach((source, index) => {
                                updatedConfig.sources.push({
                                    name: document.getElementById(`sourceName${index}`).value,
                                    url: document.getElementById(`sourceUrl${index}`).value,
                                    enabled: document.getElementById(`sourceEnabled${index}`).checked
                                });
                            });
                        }
                        
                        updateConfig(updatedConfig);
                    });
                } else {
                    configPanel.innerHTML = '<p>Error loading configuration</p>';
                }
            } catch (error) {
                console.error('Error refreshing config:', error);
                configPanel.innerHTML = '<p>Error loading configuration</p>';
            }
        }
        
        async function updateConfig(newConfig) {
            try {
                const response = await fetch(API_CONFIG, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(newConfig)
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('Configuration saved successfully');
                    refreshConfig();
                } else {
                    alert('Error saving configuration: ' + (data.error || 'Unknown error'));
                }
            } catch (error) {
                console.error('Error updating config:', error);
                alert('Error saving configuration');
            }
        }

        async function refreshAll() {
            await refreshStatus();
            await refreshLogs();
            await refreshConfig();
        }
    </script>
</body>
</html>
